# Deploy: manual only. Builds and verifies the binary without any secrets,
# then (after approval, if the production environment requires it) joins the
# tailnet as an ephemeral node and uploads the binary over SSH, through
# Tailscale only, to a server prepared as described in docs/deployment.md. It
# switches the release, restarts the service, and checks health, rolling back
# automatically if the new release is unhealthy.
#
# Automatic deploys on push are deliberately not enabled.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_id: ${{ steps.meta.outputs.release_id }}
    steps:
      - name: Only main or a version tag may be deployed
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/tags/v*) echo "Deploying $REF" ;;
            *) echo "::error::Deploy was started from $REF; choose main or a v* tag"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # for git describe

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Version
        id: meta
        run: |
          version="$(git describe --tags --always)"
          if ! printf '%s' "$version" | grep -Eq '^[A-Za-z0-9._-]+$'; then
            echo "::error::Version '$version' contains unsupported characters"
            exit 1
          fi
          release_id="$(date -u +%Y%m%dT%H%M%SZ)-$(git rev-parse --short=12 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Deploying $version as release $release_id"

      - name: Tests
        run: |
          go vet ./...
          go test -race -count=1 ./...
          (cd web && npm ci && npm run check && npm test)

      - name: Build binary with embedded frontend
        env:
          GOOS: linux
          GOARCH: amd64
          VERSION: ${{ steps.meta.outputs.version }}
        run: sh scripts/build.sh

      - name: Smoke test
        run: sh scripts/smoke-test.sh bin/rewind "${{ steps.meta.outputs.version }}"

      - name: Stage artifact
        run: |
          mkdir -p artifact
          cp bin/rewind scripts/deploy-remote.sh artifact/
          (cd artifact && sha256sum rewind > rewind.sha256)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-artifact
          path: artifact/
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to production
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      # Lets the Tailscale action request a short-lived GitHub OIDC token for
      # workload identity federation. No repository access is granted.
      id-token: write
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_DB_PATH: ${{ vars.DEPLOY_DB_PATH }}
      DEPLOY_DB_BACKUP_DIR: ${{ vars.DEPLOY_DB_BACKUP_DIR }}
      TS_TAGS: ${{ vars.TS_TAGS || 'tag:rewind-deploy' }}
      RELEASE_ID: ${{ needs.build.outputs.release_id }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Checks presence and shape only; secret values are never printed.
      # Secrets are exposed only to the steps that need them.
      - name: Check deployment configuration
        env:
          HAVE_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAVE_TS_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID != '' }}
          HAVE_TS_AUDIENCE: ${{ secrets.TS_AUDIENCE != '' }}
        run: |
          # DEPLOY_PORT comes from the job's env (shellcheck cannot see it).
          # shellcheck disable=SC2153
          deploy_port="${DEPLOY_PORT:-}"
          errors=0
          need() { if [ -z "$2" ] || [ "$2" = false ]; then echo "::error::Missing $1 (see docs/deployment.md)"; errors=$((errors+1)); fi; }
          shape() { if [ -n "$2" ] && ! printf '%s' "$2" | grep -Eq "$3"; then echo "::error::$1 has an invalid value"; errors=$((errors+1)); fi; }
          need "variable DEPLOY_HOST" "$DEPLOY_HOST"
          need "variable DEPLOY_USER" "$DEPLOY_USER"
          need "variable DEPLOY_DIR" "$DEPLOY_DIR"
          need "variable DEPLOY_SERVICE" "$DEPLOY_SERVICE"
          need "variable DEPLOY_KNOWN_HOSTS" "$DEPLOY_KNOWN_HOSTS"
          need "secret DEPLOY_SSH_KEY" "$HAVE_SSH_KEY"
          need "secret TS_OAUTH_CLIENT_ID" "$HAVE_TS_CLIENT_ID"
          need "secret TS_AUDIENCE" "$HAVE_TS_AUDIENCE"
          shape DEPLOY_PORT "$deploy_port" '^[0-9]{1,5}$'
          shape DEPLOY_USER "$DEPLOY_USER" '^[a-z_][a-z0-9_-]*$'
          shape DEPLOY_DIR "$DEPLOY_DIR" '^/[A-Za-z0-9._/-]*[A-Za-z0-9._-]$'
          shape DEPLOY_SERVICE "$DEPLOY_SERVICE" '^[A-Za-z0-9@._-]+$'
          shape DEPLOY_HEALTH_URL "$DEPLOY_HEALTH_URL" '^http://(127\.0\.0\.1|localhost|\[::1\]):[0-9]{1,5}/api/health$'
          shape DEPLOY_DB_PATH "$DEPLOY_DB_PATH" '^/[A-Za-z0-9._/-]+$'
          shape DEPLOY_DB_BACKUP_DIR "$DEPLOY_DB_BACKUP_DIR" '^/[A-Za-z0-9._/-]+$'
          shape TS_TAGS "$TS_TAGS" '^tag:[a-z0-9-]+(,tag:[a-z0-9-]+)*$'
          # The server must be addressed through the tailnet: a MagicDNS name
          # (*.ts.net) or a Tailscale IPv4 address (100.64.0.0/10).
          if [ -n "$DEPLOY_HOST" ]; then
            if printf '%s' "$DEPLOY_HOST" | grep -Eq '^([a-z0-9-]+\.)+ts\.net$'; then
              :
            elif printf '%s' "$DEPLOY_HOST" | grep -Eq '^100\.([0-9]{1,3})\.[0-9]{1,3}\.[0-9]{1,3}$' &&
                 [ "$(printf '%s' "$DEPLOY_HOST" | cut -d. -f2)" -ge 64 ] &&
                 [ "$(printf '%s' "$DEPLOY_HOST" | cut -d. -f2)" -le 127 ]; then
              :
            else
              echo "::error::DEPLOY_HOST must be the server's Tailscale name (*.ts.net) or Tailscale IP (100.64.0.0/10)"
              errors=$((errors+1))
            fi
          fi
          if [ -n "$DEPLOY_DB_PATH" ] && [ -z "$DEPLOY_DB_BACKUP_DIR" ]; then
            echo "::error::DEPLOY_DB_PATH is set but DEPLOY_DB_BACKUP_DIR is not"; errors=$((errors+1))
          fi
          case "$DEPLOY_DIR" in *..*) echo "::error::DEPLOY_DIR must not contain '..'"; errors=$((errors+1)) ;; esac
          if [ "$errors" -gt 0 ]; then exit 1; fi
          echo "Configuration complete for ${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_DIR} (service ${DEPLOY_SERVICE}, tailnet tags ${TS_TAGS})"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-artifact
          path: artifact

      - name: Verify artifact
        working-directory: artifact
        run: sha256sum -c rewind.sha256

      # Joins the tailnet as an ephemeral, tagged node using workload identity
      # federation (GitHub OIDC); no long-lived Tailscale secret exists. The
      # node logs out in the action's post step and is then removed. The
      # Tailscale client version is pinned and its download checksum-verified;
      # the binary cache is disabled so a cached copy cannot skip that check.
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ env.TS_TAGS }}
          version: "1.104.1"
          sha256sum: "108d1d96ecf410d305571e173516f27038f870919a9b89c914a167c6d33a4528"
          use-cache: "false"
          ping: ${{ env.DEPLOY_HOST }}

      # SSH connects to the server's Tailscale IP, so traffic cannot leave the
      # tailnet even if the name also resolved publicly. The host key is still
      # checked against DEPLOY_KNOWN_HOSTS under the configured name.
      - name: Resolve the server's Tailscale address
        run: |
          case "$DEPLOY_HOST" in
            100.*) addr="$DEPLOY_HOST" ;;
            *) addr="$(tailscale ip -4 "$DEPLOY_HOST" 2>/dev/null | head -n 1 || true)" ;;
          esac
          if ! printf '%s' "$addr" | grep -Eq '^100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}$'; then
            echo "::error::Could not resolve $DEPLOY_HOST to a Tailscale IPv4 address (got '${addr}'). Is the server online in the tailnet, and does the ACL allow ${TS_TAGS} to reach it?"
            exit 1
          fi
          echo "DEPLOY_ADDR=$addr" >> "$GITHUB_ENV"
          echo "Server reachable over the tailnet at $addr"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # Written from environment variables, never passed on a command line.
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts_deploy
          chmod 644 ~/.ssh/known_hosts_deploy
          cat > ~/.ssh/config <<EOF
          Host rewind-deploy
            HostName ${DEPLOY_ADDR}
            HostKeyAlias ${DEPLOY_HOST}
            CheckHostIP no
            Port ${DEPLOY_PORT:-22}
            User ${DEPLOY_USER}
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts_deploy
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
            ServerAliveInterval 15
          EOF
          chmod 600 ~/.ssh/config

      - name: Preflight checks on the server
        run: |
          ssh rewind-deploy sh -s -- preflight "$DEPLOY_DIR" "$DEPLOY_SERVICE" \
            "${DEPLOY_HEALTH_URL:-http://127.0.0.1:8090/api/health}" \
            "$DEPLOY_DB_PATH" "$DEPLOY_DB_BACKUP_DIR" < artifact/deploy-remote.sh

      - name: Upload binary
        run: scp -q artifact/rewind "rewind-deploy:$DEPLOY_DIR/releases/.incoming-$RELEASE_ID"

      - name: Activate release and check health
        run: |
          sha="$(awk '{print $1}' artifact/rewind.sha256)"
          ssh rewind-deploy sh -s -- activate "$DEPLOY_DIR" "$DEPLOY_SERVICE" \
            "${DEPLOY_HEALTH_URL:-http://127.0.0.1:8090/api/health}" \
            "$RELEASE_ID" "$sha" "$VERSION" \
            "$DEPLOY_DB_PATH" "$DEPLOY_DB_BACKUP_DIR" < artifact/deploy-remote.sh

      - name: Remove SSH credentials
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config ~/.ssh/known_hosts_deploy
